<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>나의 첫 웹페이지</title>
  <style>
    body {
      margin: 0;
      font-family: "Pretendard", "Malgun Gothic", sans-serif;
      background: #f4f6fb;
      color: #222;
      line-height: 1.7;
    }
    header {
      background: #2d4bd8;
      color: #fff;
      text-align: center;
      padding: 48px 16px;
    }
    header h1 { margin: 0 0 8px; font-size: 2rem; }
    main {
      max-width: 720px;
      margin: 32px auto;
      padding: 0 16px;
    }
    section {
      background: #fff;
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
    }
    h2 { margin-top: 0; color: #2d4bd8; }
    footer {
      text-align: center;
      color: #888;
      font-size: 0.9rem;
      padding: 24px 16px 40px;
    }
  </style>
</head>
<body>
  <header>
    <h1>안녕하세요! 👋</h1>
    <p>UX프로그래밍 수업에서 만든 나의 첫 웹페이지입니다.</p>
  </header>

  <main>
    <section>
      <h2>자기소개</h2>
      <p>저는 체육관을 운영하며 웹 개발을 배우고 있습니다.
         운동과 기술을 연결하는 서비스를 만드는 것이 목표입니다.</p>
    </section>

    <section>
      <h2>관심 분야</h2>
      <ul>
        <li>사용자 경험(UX) 디자인</li>
        <li>웹 프로그래밍 (HTML, CSS, JavaScript)</li>
        <li>운동 · 헬스케어 서비스</li>
      </ul>
    </section>

    <section>
      <h2>이 페이지는</h2>
      <p>GitHub 저장소에 올리고 GitHub Pages로 배포한 웹페이지입니다.</p>
    </section>
  </main>

  <footer>
    &copy; 2026 Gomeasy95 · UX프로그래밍 과제
  </footer>
</body>
</html>
